<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmLinha7</title>
</head>
<body>
    <main>
        <h1>Em linha 7</h1>
        <p>Você pode aplicar um estilo <em style="color: darkorange;">em linha</em>
             para um elemento usando o atributo <code style="color: darkcyan; text-decoration: underline;font-family:'Times New Roman', Times, serif;">style</code>.</p>
        <dl>
           <div>
            <dt><code>color</code></dt>
            <dd>Cor texto do elemento.</dd>
            </div>
            <div>
                <dt><code>background-color</code></dt>
                <dd>Cor de fundo do elemento.</dd>
            </div>
        </dl>
    </main>
</body>
</html>
