<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embutido7</title>
    <style>
        em {
        color: darkorange
        }
        code {
        color: darkcyan;
         text-decoration:
          underline;
        /* font-family:'Times New Roman', Times, serif; */
        }
        {
        body > main > dl > div:nth-child(2) > dt > code
            color: white;
            background-color: black;
        }
    </style>
</head>
<body>
    <main>
        <h1>Em linha 7</h1>
        <p>Você pode aplicar um estilo <em>embutido</em>
             para um elemento usando o elemento <code>style</code> no <code>head</code>.</p>
        <dl>
           <div>
            <dt><code>color</code></dt>
            <dd>Cor texto do elemento.</dd>
            </div>
            <div>
                <dt><code>background-color</code></dt>
                <dd>Cor de fundo do elemento.</dd>
            </div>
        </dl>
    </main>
</body>
</html>
