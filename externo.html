<body>
    <main>
        <h1>Externo 7</h1>
        <p>Você pode aplicar um estilo <em>externo</em>
             para um elemento usando o elemento <code>link</code> no <code>head</code>.</p>
        <dl>
           <div>
            <dt><code>color</code></dt>
            <dd>Cor texto do elemento.</dd>
            </div>
            <div>
                <dt><code>background-color</code></dt>
                <dd>Cor de fundo do elemento.</dd>
            </div>
        </dl>
    </main>
